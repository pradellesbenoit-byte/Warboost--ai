<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>WarBoost V20.2 — Offline</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:460px;background:#101a2a;border:1px solid #2b3c57;border-radius:22px;padding:24px;text-align:center;box-shadow:0 20px 60px #0008}
.logo{font-size:36px;font-weight:950}.logo span{color:#f04444}
p{color:#9dadc2;line-height:1.6}
button{border:1px solid #6e4c1e;background:#3a2710;color:#ffdc82;border-radius:12px;padding:11px 16px;font-weight:900}
</style>
</head>
<body><main><div class="card">
<div class="logo">War<span>Boost</span></div>
<h1 id="title">📴 Hors connexion</h1>
<p id="copy">WarBoost n’arrive pas à joindre le réseau. Rouvre l’application quand la connexion revient. Les données déjà enregistrées sur ton téléphone restent conservées.</p>
<button id="retry" onclick="location.reload()">↻ Réessayer</button>
</div></main>
<script>
(()=>{
  const lang=localStorage.getItem("wb17_language")||navigator.language?.slice(0,2)||"fr";
  const L={
    fr:["📴 Hors connexion","WarBoost n’arrive pas à joindre le réseau. Rouvre l’application quand la connexion revient. Les données déjà enregistrées sur ton téléphone restent conservées.","↻ Réessayer"],
    en:["📴 Offline","WarBoost can’t reach the network. Reopen the app when your connection returns. Data already saved on your phone is kept.","↻ Try again"],
    es:["📴 Sin conexión","WarBoost no puede acceder a la red. Vuelve a abrir la aplicación cuando regrese la conexión. Los datos ya guardados en tu teléfono se conservan.","↻ Reintentar"],
    de:["📴 Offline","WarBoost kann das Netzwerk nicht erreichen. Öffne die App erneut, sobald die Verbindung wieder da ist. Bereits auf deinem Smartphone gespeicherte Daten bleiben erhalten.","↻ Erneut versuchen"],
    ja:["📴 オフライン","WarBoostはネットワークに接続できません。接続が戻ったらアプリを開き直してください。スマートフォンに保存済みのデータは保持されます。","↻ 再試行"],
    zh:["📴 离线","WarBoost 无法连接网络。网络恢复后请重新打开应用。已保存在手机上的数据会继续保留。","↻ 重试"]
  };
  const t=L[lang]||L.fr;
  document.documentElement.lang=lang;
  document.getElementById("title").textContent=t[0];
  document.getElementById("copy").textContent=t[1];
  document.getElementById("retry").textContent=t[2];
})();
</script>
</body></html>
